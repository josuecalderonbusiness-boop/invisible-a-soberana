<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DEMO — Sala SIMULIVE</title>
<link rel="stylesheet" href="/mi-espacio/sala-simulive.css" />
<style>
  body { margin: 0; background: #150D11; font-family: 'Inter', sans-serif; }
  #sala-demo-qa {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: #000; color: #E8C870; font-size: 0.72rem;
    padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  #sala-demo-qa b { color: #fff; margin-right: 4px; }
  #sala-demo-qa button {
    background: #2A1C21; color: #E8C870; border: 1px solid #6B1A2A;
    border-radius: 6px; padding: 4px 8px; font-size: 0.72rem;
  }
  #sala-demo-qa button[data-activo="1"] { background: #6B1A2A; color: #fff; }
  #sala-demo-contenedor { padding-top: 34px; height: 100vh; box-sizing: border-box; }
  #sala-demo-cargando { color: #fff; text-align: center; padding: 40px 20px; }
  #sala-demo-entrada {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 0 24px; text-align: center; color: #fff;
  }
  #sala-demo-entrada h1 { font-family: 'Playfair Display', Georgia, serif; color: #D4AF6A; font-size: 1.4rem; margin-bottom: 6px; }
  #sala-demo-entrada p { color: #C4A8B0; font-size: 0.85rem; margin-bottom: 20px; max-width: 320px; }
  #sala-demo-entrada input {
    width: 100%; max-width: 320px; border-radius: 10px; border: 1px solid #6B1A2A;
    background: #1E1218; color: #fff; padding: 12px 14px; margin-bottom: 12px; font-size: 1rem;
  }
  #sala-demo-entrada button {
    width: 100%; max-width: 320px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #D4AF6A, #B8892A); color: #1E1218;
    padding: 12px; font-weight: 700; font-size: 1rem;
  }
</style>
</head>
<body>
  <div id="sala-demo-qa">
    <b>DEMO — no usar en producción real</b>
    <button data-escenario="antes">Antes de empezar</button>
    <button data-escenario="inicio">Al inicio</button>
    <button data-escenario="mas-5min">+5 min</button>
    <button data-escenario="mas-17min">+17 min</button>
    <button data-escenario="mas-42min">+42 min</button>
    <button data-escenario="cerca-cta">Cerca del CTA</button>
  </div>
  <div id="sala-demo-contenedor">
    <p id="sala-demo-cargando">Cargando…</p>
  </div>

  <script src="/mi-espacio/html-seguro.js"></script>
  <script src="/mi-espacio/sala-simulive.js"></script>
  <script>
    var CONVOCATORIA_DEMO_ID = '00000000-0000-4000-a000-000000000002';
    var escenarioActual = 'inicio';

    function marcarBotonActivo() {
      document.querySelectorAll('#sala-demo-qa button').forEach(function (b) {
        b.dataset.activo = (b.dataset.escenario === escenarioActual) ? '1' : '0';
      });
    }

    function montarSala() {
      document.getElementById('sala-demo-contenedor').innerHTML = '<div id="sala-demo-raiz"></div>';
      window.iniciarSalaSimulive({
        contenedorId: 'sala-demo-raiz',
        convocatoriaId: CONVOCATORIA_DEMO_ID,
        escenarioQA: escenarioActual,
        onNecesitaIdentidad: mostrarEntrada,
      });
    }

    function mostrarEntrada() {
      document.getElementById('sala-demo-contenedor').innerHTML =
        '<div id="sala-demo-entrada">' +
        '<h1>Tu sesión</h1>' +
        '<p>Igual que en la Masterclass real: solo tu correo, sin contraseña.</p>' +
        '<form id="sala-demo-form-entrada">' +
        '<input type="email" id="sala-demo-correo" placeholder="tu@correo.com" required autocomplete="email" />' +
        '<button type="submit">Entrar a la sesión →</button>' +
        '</form>' +
        '</div>';
      document.getElementById('sala-demo-form-entrada').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        var correo = document.getElementById('sala-demo-correo').value.trim();
        if (!correo) return;
        try {
          var res = await fetch('/api/sala-demo-entrar', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo: correo }),
          });
          if (!res.ok) throw new Error('sala-demo-entrar respondió ' + res.status);
          montarSala();
        } catch (e) {
          document.getElementById('sala-demo-contenedor').innerHTML =
            '<p id="sala-demo-cargando">No pudimos registrar tu entrada. Intenta de nuevo.</p>';
        }
      });
    }

    document.querySelectorAll('#sala-demo-qa button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        escenarioActual = btn.dataset.escenario;
        marcarBotonActivo();
        montarSala();
      });
    });

    marcarBotonActivo();
    montarSala();
  </script>
</body>
</html>
